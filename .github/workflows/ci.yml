name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # surface encoding bugs: never let UTF-8 mode paper over a missing encoding=
      PYTHONUTF8: "0"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # runs tests/test_dashboard_js.py instead of skipping it
      - name: Install
        run: uv sync --frozen
      - name: Test
        run: uv run pytest -q
