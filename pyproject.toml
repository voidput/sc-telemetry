[project]
name = "scgameapi"
version = "0.1.0"
description = "Client, docs and dashboard for Star Citizen's local Game Telemetry gRPC API (unofficial)"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Private :: Do Not Upload",
]
dependencies = [
    "fastapi>=0.165.0",
    "grpcio>=1.85.3",
    "grpcio-tools>=1.85.3",
    "protobuf>=7.36.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
scgameapi-dashboard = "scgameapi.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scgameapi"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # fastapi.testclient -> starlette: "Using httpx with starlette.testclient is deprecated; install httpx2"
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
